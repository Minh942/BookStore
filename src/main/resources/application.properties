# C?u hình datasource cho MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tuvi?useSSL=false&serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=admin

# C?u hình Hibernate ?? t? ??ng t?o DB và b?ng
spring.jpa.hibernate.ddl-auto=update

# Ch?n dialect phù h?p v?i MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hi?n th? SQL query trong log (tùy ch?n)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.mvc.view.prefix=/resources/templates/
spring.mvc.view.suffix=.html

